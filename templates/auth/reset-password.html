{% extends "auth/base.html" %}

{% block title %}Reset Password - Personal Assistant{% endblock %}

{% block content %}
<div class="auth-card">
    <div class="auth-header">
        <div class="auth-logo">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path>
            </svg>
        </div>
        <h1>Set new password</h1>
        <p>Enter your new password below</p>
    </div>

    <div id="alert" class="alert" style="display: none;"></div>

    <form id="reset-form">
        <input type="hidden" id="token" value="{{ token }}">

        <div class="form-group">
            <label class="form-label" for="password">New Password</label>
            <input type="password" id="password" name="password" class="form-input" placeholder="Enter new password" required minlength="8">
            <div class="password-requirements">
                <ul>
                    <li>At least 8 characters</li>
                    <li>At least one letter and one number</li>
                </ul>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" name="confirm-password" class="form-input" placeholder="Confirm new password" required>
        </div>

        <button type="submit" class="btn btn-primary" id="submit-btn">
            <span id="btn-text">Reset password</span>
            <div id="btn-spinner" class="spinner" style="display: none;"></div>
        </button>
    </form>

    <div class="auth-footer">
        <a href="/login">Back to login</a>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const form = document.getElementById('reset-form');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');

    // Check if token is present
    const token = document.getElementById('token').value;
    if (!token) {
        showError('Invalid or missing reset token. Please request a new password reset.');
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearAlert();

        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm-password').value;

        // Validate passwords match
        if (password !== confirmPassword) {
            showError('Passwords do not match');
            return;
        }

        // Disable button and show spinner
        submitBtn.disabled = true;
        btnText.style.display = 'none';
        btnSpinner.style.display = 'block';

        try {
            const result = await api('/auth/reset-password', {
                method: 'POST',
                body: JSON.stringify({ token, password }),
            });

            showSuccess(result.message + ' Redirecting to login...');

            // Redirect to login after 2 seconds
            setTimeout(() => {
                window.location.href = '/login';
            }, 2000);
        } catch (error) {
            showError(error.message);
            submitBtn.disabled = false;
            btnText.style.display = 'block';
            btnSpinner.style.display = 'none';
        }
    });
</script>
{% endblock %}
